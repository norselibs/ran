plugins {
    id 'java'
}

description = 'automapper-core'

repositories {
    mavenCentral()
}


dependencies {
    testImplementation 'org.mockito:mockito-core:5.12.0'

    testImplementation group: 'junit', name: 'junit', version: '4.13.2'
    testImplementation group: 'com.google.inject', name: 'guice', version: '5.1.0'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    implementation 'javax.inject:javax.inject:1'
    implementation group: 'org.ow2.asm', name: 'asm', version: '9.7'
    implementation group: 'org.ow2.asm', name: 'asm-util', version: '9.7'
    implementation 'cglib:cglib:3.3.0'

}
